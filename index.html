<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>마트나침반 | 실시간 100g당 가격비교</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- HTML5 QR Code / Barcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <link rel="stylesheet" href="style.css?v=3.0">
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex justify-center selection:bg-blue-500 selection:text-white antialiased font-sans">

  <!-- Mobile App Frame Container -->
  <div class="w-full max-w-md min-h-screen bg-white shadow-2xl flex flex-col relative pb-20 border-x border-slate-200">
    
    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-4 py-3 border-b border-slate-100 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>
        <h1 class="text-base font-black tracking-tight text-slate-900">마트나침반</h1>
      </div>

      <!-- Neighborhood Location Selector -->
      <button id="btnSelectLocation" class="flex items-center space-x-1 px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded-full transition text-xs font-bold text-slate-700">
        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-500"></i>
        <span id="currentLocationName">서울 강남구</span>
        <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400"></i>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 px-4 py-3.5 space-y-3 overflow-y-auto">

      <!-- 🔍 Search Bar & Single Unified AI Camera Button -->
      <div class="space-y-2">
        <div class="relative">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="상품명 또는 880 바코드 입력 (예: 신라면, 햇반)" 
            class="w-full pl-9 pr-14 py-3 bg-slate-100 text-slate-900 placeholder-slate-400 rounded-2xl text-sm font-bold focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-600 transition shadow-inner"
          >
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
          <button 
            id="btnSearch" 
            class="absolute right-1.5 top-1.5 bottom-1.5 px-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black transition shadow-xs"
          >
            검색
          </button>
        </div>

        <!-- 🌟 Single Unified Smart Camera Button -->
        <button 
          id="btnOpenSmartCamera" 
          class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 hover:from-blue-700 hover:to-indigo-800 text-white rounded-2xl font-black text-sm shadow-md shadow-blue-500/20 flex items-center justify-center space-x-2 transition active:scale-98"
        >
          <i data-lucide="camera" class="w-4 h-4"></i>
          <span>AI 카메라 스캔 (바코드 & 사진 자동인식)</span>
        </button>
      </div>

      <!-- Hidden Native Camera File Input -->
      <input type="file" id="aiPhotoInput" accept="image/*" capture="environment" class="hidden">

      <!-- ⏳ Loading State -->
      <div id="loadingState" class="hidden py-10 text-center space-y-3">
        <div class="inline-block w-8 h-8 border-3 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p id="loadingText" class="text-xs font-bold text-slate-600">실시간 가격을 비교 중입니다...</p>
      </div>

      <!-- 📦 Main Search Result Section (100% Dynamic from API) -->
      <div id="resultSection" class="hidden space-y-3">
        
        <!-- Product Header Card with Real Package Image -->
        <div class="bg-slate-50/90 rounded-2xl p-3.5 border border-slate-200 space-y-2.5">
          <div class="flex space-x-3 items-center">
            <div id="productImgContainer" class="w-16 h-16 rounded-xl overflow-hidden border border-slate-200 bg-white flex-shrink-0 flex items-center justify-center">
              <img id="productImg" src="" alt="실제 제품 패키지" class="w-full h-full object-contain p-1">
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-[10px] font-extrabold text-blue-700 bg-blue-100 px-1.5 py-0.5 rounded">기준: 100g/개당 정밀 환산</span>
              <h2 id="productName" class="text-sm font-black text-slate-900 truncate mt-1"></h2>
            </div>
          </div>

          <!-- 1-Second Unit Price Verdict Banner -->
          <div id="verdictBanner" class="p-2.5 rounded-xl flex items-center justify-between text-xs font-bold transition">
            <!-- Populated dynamically by JS -->
          </div>
        </div>

        <!-- 🏬 Section 1: 내 근처 오프라인 마트 (단가 기준) -->
        <div class="space-y-2">
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-black text-slate-900 flex items-center">
              <i data-lucide="store" class="w-3.5 h-3.5 text-blue-600 mr-1"></i>
              내 근처 마트 실시간 가격
            </span>
            <span class="text-[10px] font-bold text-slate-400">100g당 단가순</span>
          </div>
          <div id="martsListContainer" class="space-y-1.5">
            <!-- Populated dynamically by JS -->
          </div>
        </div>

        <!-- 🌐 Section 2: 온라인 실시간 최저가 (배송비 포함) -->
        <div class="space-y-2 pt-1">
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-black text-slate-900 flex items-center">
              <i data-lucide="globe" class="w-3.5 h-3.5 text-emerald-600 mr-1"></i>
              온라인 실시간 최저가
            </span>
            <span class="text-[10px] font-bold text-slate-400">배송비 포함</span>
          </div>
          <div id="onlineListContainer" class="space-y-1.5">
            <!-- Populated dynamically by JS -->
          </div>
        </div>

      </div>

    </main>

    <!-- Location Selection Modal -->
    <div id="locationModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
      <div class="w-full max-w-xs bg-white rounded-2xl shadow-2xl p-4 space-y-3">
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <span class="font-black text-slate-900 text-sm">내 동네 마트 위치 설정</span>
          <button id="btnCloseLocationModal" class="text-slate-400 hover:text-slate-600">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="neighborhoodOptions" class="space-y-1.5 text-xs">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- 📸 Unified Smart Camera Modal (Barcode + Photo) -->
    <div id="cameraModal" class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-between p-4 hidden">
      <div class="w-full flex items-center justify-between text-white pt-2">
        <span class="font-bold text-sm flex items-center">
          <i data-lucide="camera" class="w-4 h-4 text-blue-400 mr-1.5"></i>
          AI 스마트 스캔 중
        </span>
        <button id="btnCloseScanner" class="p-2 text-white/80 hover:text-white">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Live Video Feed / Barcode Box -->
      <div class="w-full max-w-xs flex-1 flex flex-col items-center justify-center my-2 relative">
        <div id="reader" class="w-full rounded-2xl overflow-hidden border-2 border-blue-500/80 bg-black shadow-2xl"></div>
        <p class="text-[11px] text-slate-300 mt-2.5 text-center bg-black/60 px-3 py-1 rounded-full">
          💡 바코드는 자동 감지 / 바코드 없으면 아래 촬영 버튼 터치!
        </p>
      </div>

      <!-- Photo Shutter Button -->
      <div class="w-full max-w-xs space-y-2 pb-4">
        <button 
          id="btnSnapPhotoInsideModal" 
          class="w-full py-3 bg-white hover:bg-slate-100 text-slate-900 rounded-2xl font-black text-sm shadow-lg flex items-center justify-center space-x-2 transition active:scale-95"
        >
          <i data-lucide="camera" class="w-5 h-5 text-blue-600"></i>
          <span>📸 상품 포장지 사진 찍기</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Load Scripts with Cache-Busters -->
  <script src="data.js?v=3.0"></script>
  <script src="supabaseClient.js?v=3.0"></script>
  <script src="app.js?v=3.0"></script>
</body>
</html>
